

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: talentflow-backend
    ports:
      - "8000:8000"
    environment:
      # FastAPI Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO

      # CrewAI Configuration
      USE_MOCK_CREW: "true"
      CREW_MODEL: gpt-4
      CREW_MAX_RPM: "10"
      CREW_MAX_ITER: "12"

      # Security (MVP stub)
      API_KEY: dev-key-123

      # CORS
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:3000

      # Logging
      ENABLE_JSON_LOGS: "false"
      TRACE_ID_ENABLED: "true"

      # Optional: Uncomment and set your OpenAI key for real LLM execution
      # USE_MOCK_CREW: "false"
      # OPENAI_API_KEY: sk-your-key-here
    volumes:
      - ./backend:/app
    networks:
      - talentflow-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: talentflow-frontend
    ports:
      - "3000:3000"
    environment:
      # API Configuration (frontend)
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_TIMEOUT_MS: "30000"

      # Features
      VITE_DEMO_MODE: "false"
    networks:
      - talentflow-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  talentflow-network:
    driver: bridge
